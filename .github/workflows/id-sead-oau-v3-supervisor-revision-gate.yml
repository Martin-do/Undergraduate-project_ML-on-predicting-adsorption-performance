name: ID-SEAD OAU V3 supervisor revision gate

on:
  push:
    branches:
      - conference/id-sead-oau-v3-supervisor-revision
    paths:
      - 'conference_salvage/supervisor_revision_gate_v3/**'
      - 'validation_v2/**'
      - 'conference_salvage/reproducibility/requirements.txt'
      - '.github/workflows/id-sead-oau-v3-supervisor-revision-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supervisor-revision-gate-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned historical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: 'pip'
          cache-dependency-path: conference_salvage/reproducibility/requirements.txt

      - name: Install pinned environment
        run: python -m pip install -r conference_salvage/reproducibility/requirements.txt

      - name: Verify frozen corrected baseline still passes
        run: |
          python conference_salvage/reproducibility/run_corrected_validation.py
          python -m unittest discover conference_salvage/reproducibility/tests -v

      - name: Run targeted supervisor revision analyses
        run: python conference_salvage/supervisor_revision_gate_v3/run_supervisor_revision_gate_v3.py

      - name: Run V3 applicability-domain diagnostic
        run: python conference_salvage/supervisor_revision_gate_v3/run_applicability_domain_v3.py

      - name: Record environment and checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=conference_salvage/supervisor_revision_gate_v3/outputs
          python --version > "$OUT/python_version.txt"
          python -m pip freeze > "$OUT/pip_freeze.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt)

      - name: Upload OAU V3 supervisor revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id-sead-oau-v3-supervisor-revision-gate
          path: conference_salvage/supervisor_revision_gate_v3/outputs/
          if-no-files-found: error
          retention-days: 90
