name: Paper 1 Moosavi 2021 matched validation

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/moosavi2021_table_s1_extract.py'
      - 'validation_v2/moosavi2021_matched_validation.py'
      - '.github/workflows/paper1-moosavi2021-matched-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn requests pdfplumber
      - name: Extract official Table S1 and provenance groups
        run: python validation_v2/moosavi2021_table_s1_extract.py
      - name: Run matched random-vs-study-aware validation
        run: python validation_v2/moosavi2021_matched_validation.py
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-moosavi2021-matched-validation
          path: |
            validation_v2/outputs/multidataset/moosavi2021_table_s1/
            validation_v2/outputs/multidataset/moosavi2021_matched_validation/
          if-no-files-found: error
