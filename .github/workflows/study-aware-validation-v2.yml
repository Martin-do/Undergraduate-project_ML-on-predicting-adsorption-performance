name: Study-aware validation V2

on:
  push:
    branches:
      - feature/study-aware-validation-v2
    paths:
      - 'validation_v2/**'
      - 'final_final_adsorption_done_dataset.csv'
      - '.github/workflows/study-aware-validation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost

      - name: Run study-aware validation
        run: python validation_v2/study_aware_validation.py

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-aware-validation-v2-results
          path: validation_v2/outputs/
          if-no-files-found: error
