name: Paper 2 V3 phosphate primary access

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/audit_phosphate_primary_access.py'
      - '.github/workflows/paper2-v3-phosphate-primary-access.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests
      - name: Audit primary-source access
        run: python paper2_v3/audit_phosphate_primary_access.py
      - name: Upload access audit
        uses: actions/upload-artifact@v4
        with:
          name: paper2-v3-phosphate-primary-access
          path: paper2_v3/outputs/phosphate_primary_access/
