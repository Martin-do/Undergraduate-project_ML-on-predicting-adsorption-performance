name: Paper 1 Liu 2025 provenance block audit

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/liu2025_provenance_block_audit.py'
      - '.github/workflows/paper1-liu2025-provenance-block-audit.yml'
      - 'Biochar_dye_filtered.xlsx'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl numpy
      - name: Run provenance block audit
        run: python validation_v2/liu2025_provenance_block_audit.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-liu2025-provenance-block-audit
          path: validation_v2/outputs/multidataset/liu2025_provenance_blocks/
          if-no-files-found: error
