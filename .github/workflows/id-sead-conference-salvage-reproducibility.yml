name: ID-SEAD conference salvage reproducibility

on:
  push:
    branches:
      - conference/id-sead-salvage
    paths:
      - 'conference_salvage/reproducibility/**'
      - 'validation_v2/**'
      - '.github/workflows/id-sead-conference-salvage-reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrected-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up historical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: 'pip'
          cache-dependency-path: conference_salvage/reproducibility/requirements.txt

      - name: Install pinned historical environment
        run: python -m pip install -r conference_salvage/reproducibility/requirements.txt

      - name: Show environment
        run: |
          python --version
          python -m pip freeze

      - name: Run corrected conference validation
        run: python conference_salvage/reproducibility/run_corrected_validation.py

      - name: Run reproducibility contract tests
        run: python -m unittest discover conference_salvage/reproducibility/tests -v

      - name: Upload conference evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id-sead-conference-salvage-reproducibility
          path: conference_salvage/reproducibility/outputs/
          if-no-files-found: error
          retention-days: 90
