name: Publish adsorption dataset V2.1

on:
  push:
    branches:
      - feature/study-aware-validation-v2
    paths:
      - '.github/workflows/publish-dataset-v21.yml'
      - 'validation_v2/build_dataset_v21.py'
      - 'validation_v2/non_iftikhar_primary_source_map_v21.csv'
      - 'validation_v2/adsorption_dataset_v2.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/study-aware-validation-v2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install pandas
      - name: Build V2.1
        run: python validation_v2/build_dataset_v21.py
      - name: Stage canonical V2.1 files
        run: |
          cp validation_v2/outputs/adsorption_dataset_v2_1.csv validation_v2/adsorption_dataset_v2_1.csv
          cp validation_v2/outputs/adsorption_dataset_v2_1_summary.json validation_v2/adsorption_dataset_v2_1_summary.json
          cp validation_v2/outputs/non_iftikhar_v21_match_audit.csv validation_v2/non_iftikhar_v21_match_audit.csv
      - name: Commit generated dataset if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_v2/adsorption_dataset_v2_1.csv validation_v2/adsorption_dataset_v2_1_summary.json validation_v2/non_iftikhar_v21_match_audit.csv
          if git diff --cached --quiet; then
            echo "V2.1 files already current"
          else
            git commit -m "data: publish canonical adsorption dataset V2.1"
            git push origin HEAD:feature/study-aware-validation-v2
          fi
