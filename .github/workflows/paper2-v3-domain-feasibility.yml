name: Paper 2 V3 domain feasibility

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/audit_candidate_domain_datasets.py'
      - '.github/workflows/paper2-v3-domain-feasibility.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests
      - name: Run source-first feasibility audit
        run: python paper2_v3/audit_candidate_domain_datasets.py
      - name: Upload feasibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper2-v3-domain-feasibility
          path: paper2_v3/outputs/domain_feasibility/
