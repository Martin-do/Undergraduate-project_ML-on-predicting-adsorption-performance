name: Paper 1 Liu 2025 public dataset screen

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/liu2025_public_dataset_screen.py'
      - '.github/workflows/paper1-liu2025-screen.yml'
      - 'Biochar_dye_filtered.xlsx'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install screening dependencies
        run: python -m pip install --upgrade pip pandas openpyxl
      - name: Screen workbook and provenance fields
        run: python validation_v2/liu2025_public_dataset_screen.py
      - name: Upload screening evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-liu2025-public-dataset-screen
          path: validation_v2/outputs/multidataset/liu2025_screen/
          if-no-files-found: error
