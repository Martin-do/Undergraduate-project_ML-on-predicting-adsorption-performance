name: Paper 2 V3 domain selection gate

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/evaluate_domain_selection_gate.py'
      - '.github/workflows/paper2-v3-domain-selection-gate.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests
      - name: Run domain selection gate
        run: python paper2_v3/evaluate_domain_selection_gate.py
      - name: Upload domain gate outputs
        uses: actions/upload-artifact@v4
        with:
          name: paper2-v3-domain-selection-gate
          path: paper2_v3/outputs/domain_selection_gate/
