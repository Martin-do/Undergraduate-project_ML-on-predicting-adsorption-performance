name: Paper 2 V3 phosphate extraction map

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/map_phosphate_extraction_evidence.py'
      - '.github/workflows/paper2-v3-phosphate-extraction-map.yml'
  workflow_dispatch:

jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests
      - name: Build extraction-evidence map
        run: python paper2_v3/map_phosphate_extraction_evidence.py
      - name: Upload extraction-evidence map
        uses: actions/upload-artifact@v4
        with:
          name: paper2-v3-phosphate-extraction-map
          path: paper2_v3/outputs/phosphate_extraction_map/
