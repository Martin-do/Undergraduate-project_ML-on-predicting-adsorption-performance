name: Paper 1 Liu 2025 matched validation

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/liu2025_primary_study_provenance.py'
      - 'validation_v2/liu2025_matched_validation.py'
      - 'Biochar_dye_filtered.xlsx'
      - '.github/workflows/paper1-liu2025-matched-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl numpy scikit-learn xgboost catboost
      - name: Rebuild provenance gate
        run: python validation_v2/liu2025_primary_study_provenance.py
      - name: Run matched validation
        run: python validation_v2/liu2025_matched_validation.py
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-liu2025-matched-validation
          path: |
            validation_v2/outputs/multidataset/liu2025_primary_provenance/
            validation_v2/outputs/multidataset/liu2025_matched_validation/
          if-no-files-found: error
