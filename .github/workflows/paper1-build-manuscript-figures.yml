name: Paper 1 build manuscript figures

# Deterministic renderer for the frozen representative evidence set.
on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'paper1/manuscript/build_figures.py'
      - 'validation_v2/MULTIDATASET_RESULTS_REGISTRY.csv'
      - '.github/workflows/paper1-build-manuscript-figures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-figures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plotting dependencies
        run: python -m pip install --upgrade pip pandas matplotlib

      - name: Build deterministic draft figures
        run: python paper1/manuscript/build_figures.py

      - name: Upload manuscript figures
        uses: actions/upload-artifact@v4
        with:
          name: paper1-manuscript-figures-v1
          path: paper1/manuscript/figures/
          if-no-files-found: error
