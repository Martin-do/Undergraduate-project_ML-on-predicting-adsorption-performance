name: Paper 1 Liu 2025 public CatBoost reconstruction

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/liu2025_public_catboost_reconstruction.py'
      - 'Biochar_dye_filtered.xlsx'
      - '.github/workflows/paper1-liu2025-public-catboost-reconstruction.yml'
  workflow_dispatch:

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl numpy scikit-learn catboost scikit-optimize
      - name: Reconstruct public random pipeline
        run: python validation_v2/liu2025_public_catboost_reconstruction.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-liu2025-public-catboost-reconstruction
          path: validation_v2/outputs/multidataset/liu2025_public_catboost_reconstruction/
          if-no-files-found: error
