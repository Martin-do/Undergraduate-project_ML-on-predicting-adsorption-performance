name: Paper 1 multi-dataset synthesis

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/MULTIDATASET_RESULTS_REGISTRY.csv'
      - 'validation_v2/SOURCE_AWARE_COMPARATOR_REGISTRY.csv'
      - 'validation_v2/multidataset_synthesis.py'
      - '.github/workflows/paper1-multidataset-synthesis.yml'
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy matplotlib
      - name: Generate locked synthesis tables and figures
        run: python validation_v2/multidataset_synthesis.py
      - name: Upload deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-multidataset-synthesis
          path: validation_v2/outputs/multidataset/synthesis/
          if-no-files-found: error
