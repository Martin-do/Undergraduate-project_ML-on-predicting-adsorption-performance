name: Paper 2 V3 phosphate source queue

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/build_phosphate_source_verification_queue.py'
      - '.github/workflows/paper2-v3-phosphate-source-queue.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests
      - name: Build source verification queue
        run: python paper2_v3/build_phosphate_source_verification_queue.py
      - name: Upload source queue
        uses: actions/upload-artifact@v4
        with:
          name: paper2-v3-phosphate-source-queue
          path: paper2_v3/outputs/phosphate_source_queue/
