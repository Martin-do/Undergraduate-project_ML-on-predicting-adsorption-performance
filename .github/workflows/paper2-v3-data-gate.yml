name: Paper 2 V3 data gate

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/**'
      - '.github/workflows/paper2-v3-data-gate.yml'
  workflow_dispatch:

jobs:
  validate-v3-template:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install pandas
      - name: Validate V3 schema template
        run: python paper2_v3/validate_v3_dataset.py paper2_v3/adsorption_v3_template.csv
