name: Paper 1 Liu 2024 ammonia historical dataset screen

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/liu2024_ammonia_historical_dataset_screen.py'
      - '.github/workflows/paper1-liu2024-ammonia-historical-screen.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl numpy requests
      - name: Recover and screen historical workbook
        run: python validation_v2/liu2024_ammonia_historical_dataset_screen.py
      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-liu2024-ammonia-historical-screen
          path: validation_v2/outputs/multidataset/liu2024_ammonia_historical_screen/
          if-no-files-found: error
