name: ID-SEAD reviewer revision gate V2

on:
  push:
    branches:
      - conference/id-sead-salvage
    paths:
      - 'conference_salvage/reviewer_revision_gate_v2/**'
      - 'validation_v2/**'
      - '.github/workflows/id-sead-reviewer-revision-gate-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-revision-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up historical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: 'pip'
          cache-dependency-path: conference_salvage/reproducibility/requirements.txt

      - name: Install pinned environment
        run: python -m pip install -r conference_salvage/reproducibility/requirements.txt

      - name: Run reviewer revision gate analyses
        run: python conference_salvage/reviewer_revision_gate_v2/run_reviewer_revision_gate_v2.py

      - name: Run LOSO identity-ablation follow-up
        run: python conference_salvage/reviewer_revision_gate_v2/run_identity_loso_followup.py

      - name: Run crossed identity-missingness sensitivity
        run: python conference_salvage/reviewer_revision_gate_v2/run_crossed_missingness_sensitivity.py

      - name: Upload reviewer revision gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id-sead-reviewer-revision-gate-v2
          path: conference_salvage/reviewer_revision_gate_v2/outputs/
          if-no-files-found: error
          retention-days: 90
