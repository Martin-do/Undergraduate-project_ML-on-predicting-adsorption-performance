name: Paper 1 Liu 2025 full public extract

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/liu2025_full_public_extract.py'
      - 'Biochar_dye_filtered.xlsx'
      - '.github/workflows/paper1-liu2025-full-extract.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl
      - name: Export deterministic evidence
        run: python validation_v2/liu2025_full_public_extract.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-liu2025-full-public-extract
          path: validation_v2/outputs/multidataset/liu2025_full_extract/
          if-no-files-found: error
