name: Primary-study holdout V2

on:
  push:
    branches:
      - feature/study-aware-validation-v2
    paths:
      - 'validation_v2/primary_study_holdout_validation.py'
      - 'validation_v2/primary_study_map.csv'
      - 'validation_v2/feature_parity_validation.py'
      - 'validation_v2/feature_parity_validation_fixed.py'
      - 'validation_v2/study_aware_validation.py'
      - 'final_final_adsorption_done_dataset.csv'
      - '.github/workflows/primary-study-holdout-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-primary-studies:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost

      - name: Run strict confirmed-primary-study holdout
        run: python validation_v2/primary_study_holdout_validation.py

      - name: Upload primary-study validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-study-holdout-v2-results
          path: validation_v2/outputs/primary_study_holdout_*
          if-no-files-found: error
