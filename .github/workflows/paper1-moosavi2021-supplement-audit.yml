name: Paper 1 Moosavi 2021 supplement audit

on:
  push:
    branches:
      - paper1/multidataset-study-aware-replication
    paths:
      - 'validation_v2/moosavi2021_supplement_acquire.py'
      - '.github/workflows/paper1-moosavi2021-supplement-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl xlrd requests beautifulsoup4
      - name: Acquire and inspect open supplement
        run: python validation_v2/moosavi2021_supplement_acquire.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: paper1-moosavi2021-supplement-audit
          path: validation_v2/outputs/multidataset/moosavi2021_supplement/
          if-no-files-found: error
