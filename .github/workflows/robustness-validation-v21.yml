name: Robustness validation V2.1

on:
  push:
    branches:
      - feature/study-aware-validation-v2
    paths:
      - 'validation_v2/robustness_validation_v21.py'
      - 'validation_v2/build_dataset_v21.py'
      - 'validation_v2/non_iftikhar_primary_source_map_v21.csv'
      - 'validation_v2/adsorption_dataset_v2.csv'
      - 'validation_v2/external_validation_v2.py'
      - 'validation_v2/feature_parity_validation*.py'
      - 'validation_v2/study_aware_validation.py'
      - 'Biochar_dye_filtered.xlsx'
      - 'Raw_data.xlsx'
      - '.github/workflows/robustness-validation-v21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn xgboost openpyxl
      - name: Run V2.1 robustness checks
        run: python validation_v2/robustness_validation_v21.py
      - name: Upload V2.1 robustness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-validation-v21-results
          path: |
            validation_v2/outputs/adsorption_dataset_v2_1.csv
            validation_v2/outputs/adsorption_dataset_v2_1_summary.json
            validation_v2/outputs/robustness_v21_*
          if-no-files-found: error
