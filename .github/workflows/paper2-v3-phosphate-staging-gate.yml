name: Paper 2 V3 phosphate verified staging gate

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/PHOSPHATE_V3_PRIMARY_VERIFIED_STAGING.csv'
      - 'paper2_v3/PHOSPHATE_PRIMARY_SOURCE_VERIFICATION_STANDARD.md'
      - 'paper2_v3/DATASET_SCHEMA_V3.csv'
      - 'paper2_v3/PHOSPHATE_EXTERNAL_HOLDOUT_REGISTRY_V0.csv'
      - 'paper2_v3/validate_phosphate_verified_staging.py'
      - '.github/workflows/paper2-v3-phosphate-staging-gate.yml'
  workflow_dispatch:

jobs:
  validate-staging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install pandas
      - name: Validate primary-verified staging ledger
        run: python paper2_v3/validate_phosphate_verified_staging.py
      - name: Upload deterministic staging-gate audit
        uses: actions/upload-artifact@v4
        with:
          name: paper2-v3-phosphate-verified-staging-gate
          path: paper2_v3/outputs/phosphate_verified_staging_gate/
          if-no-files-found: error
