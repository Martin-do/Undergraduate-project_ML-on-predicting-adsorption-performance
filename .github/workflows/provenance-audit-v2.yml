name: Provenance audit V2

on:
  push:
    branches:
      - feature/study-aware-validation-v2
    paths:
      - 'validation_v2/provenance_*.py'
      - 'validation_v2/upstream_*.py'
      - 'validation_v2/unresolved_upstream_signatures.py'
      - 'validation_v2/build_canonical_dataset.py'
      - 'validation_v2/*provenance*.csv'
      - 'validation_v2/primary_study_map.csv'
      - 'validation_v2/adsorbent_domain_map.csv'
      - 'final_final_adsorption_done_dataset.csv'
      - '.github/workflows/provenance-audit-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install provenance dependency
        run: pip install pandas

      - name: Build project provenance inventory
        run: python validation_v2/provenance_inventory.py

      - name: Recover upstream Iftikhar references
        run: python validation_v2/upstream_iftikhar_ref_audit.py

      - name: Inventory both upstream workbooks
        run: python validation_v2/upstream_workbook_inventory.py

      - name: Inspect discarded upstream metadata
        run: python validation_v2/upstream_hidden_metadata_audit.py

      - name: Extract unresolved experimental fingerprints
        run: python validation_v2/unresolved_upstream_signatures.py

      - name: Audit unresolved workbook block context
        run: python validation_v2/upstream_block_context.py

      - name: Build canonical 322-row V2 dataset
        run: python validation_v2/build_canonical_dataset.py

      - name: Publish canonical dataset files on validation branch
        run: |
          cp validation_v2/outputs/adsorption_dataset_v2.csv validation_v2/adsorption_dataset_v2.csv
          cp validation_v2/outputs/adsorption_dataset_v2_data_dictionary.csv validation_v2/adsorption_dataset_v2_data_dictionary.csv
          cp validation_v2/outputs/adsorption_dataset_v2_summary.json validation_v2/adsorption_dataset_v2_summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_v2/adsorption_dataset_v2.csv validation_v2/adsorption_dataset_v2_data_dictionary.csv validation_v2/adsorption_dataset_v2_summary.json
          if git diff --cached --quiet; then
            echo "Canonical V2 dataset is already up to date."
          else
            git commit -m "data: publish canonical adsorption dataset v2"
            git push origin HEAD:feature/study-aware-validation-v2
          fi

      - name: Upload provenance evidence and canonical dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance-audit-v2-results
          path: validation_v2/outputs/
          if-no-files-found: error
