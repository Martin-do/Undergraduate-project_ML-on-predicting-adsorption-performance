name: Paper 2 V3 phosphate verification packets

on:
  push:
    branches:
      - paper2/v3-provenance-aware-model-development
    paths:
      - 'paper2_v3/build_phosphate_verification_packets.py'
      - 'paper2_v3/PHOSPHATE_SOURCE_VERIFICATION_BATCH02_OPEN_ACCESS.csv'
      - '.github/workflows/paper2-v3-phosphate-verification-packets.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas openpyxl requests
      - name: Build source verification packets
        run: python paper2_v3/build_phosphate_verification_packets.py
      - name: Upload verification packets
        uses: actions/upload-artifact@v4
        with:
          name: paper2-v3-phosphate-verification-packets
          path: paper2_v3/outputs/phosphate_verification_packets/
